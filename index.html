<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rota Viva - Calculadora Norte</title>
<style>
:root{--bg:#121212;--card:#1E1E1E;--card2:#252525;--line:#2A2A2A;--text:#fff;--muted:#9A9A9A;--blue:#2F6BFF;--red:#B91C1C}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{background:var(--bg);color:var(--text);padding:16px}
.header{max-width:480px;margin:0 auto}
h1{text-align:center;font-size:32px;font-weight:800;margin:10px 0}
.tabs{display:flex;background:var(--card);border-radius:12px;padding:4px;margin:16px 0}
.tab{flex:1;padding:12px;text-align:center;border-radius:8px;font-weight:600;color:var(--muted)}
.tab.active{background:var(--card2);color:var(--text);border-bottom:2px solid #fff}
.block{background:var(--card);border-radius:16px;padding:16px;margin-bottom:16px;border:1px solid var(--line)}
.label{color:var(--muted);font-size:13px;margin-bottom:4px}
.select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px;color:#fff;font-weight:700;display:flex;justify-content:space-between}
.invert{display:flex;justify-content:center;margin:8px 0;color:var(--muted)}
.section-title{font-size:18px;font-weight:800;margin-bottom:2px}
.section-sub{font-size:12px;color:var(--muted);margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);text-align:center;font-weight:600;cursor:pointer}
.pill.active{border-color:var(--blue);background:#1A2A4A;color:#7CA3FF}
.input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px;color:#fff}
.chips{display:flex;gap:8px;margin-top:10px}
.chip{padding:8px 14px;border-radius:20px;background:var(--card2);border:1px solid var(--line);font-size:13px}
.filters{display:flex;gap:8px;margin:8px 0 16px}
.f{padding:10px 16px;border-radius:20px;border:1px solid var(--line);background:var(--card2);font-weight:600}
.f.active{background:#244A60;color:#7ED6FF}
.card{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--card);margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:center}
.price{font-size:22px;font-weight:800}
.row{display:flex;gap:8px;margin-top:10px}
.edit{flex:1;background:var(--card2);border-radius:8px;padding:8px;font-size:12px;border:1px solid var(--line)}
.cambio{background:var(--card);border-radius:12px;padding:14px;display:flex;justify-content:space-between;border:1px solid var(--line);margin-top:12px}
.warn{background:var(--red);border-radius:12px;padding:12px;font-size:11px;margin-top:12px;display:flex;gap:8px}
.footer{text-align:center;color:var(--muted);font-size:11px;margin-top:12px}
</style>
</head>
<body>
<div class="header">
<h1>Rota Viva</h1>

<div class="tabs">
<div class="tab active">Calculadora</div>
<div class="tab">Histórico</div>
<div class="tab
