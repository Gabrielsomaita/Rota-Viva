<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<title>Rota Viva</title>
<style>
:root{--bg:#0e1e1c;--card:#1a2e2b;--line:#243e3a;--ink:#e6f0ee;--mute:#8aa39e;--acc:#c4a4ff;--ok:#4ade80;--okbg:#143d2a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;padding:0 14px 24px}
main{max-width:620px;margin:0 auto}h1{text-align:center;margin:22px 0 4px}.sub{text-align:center;color:var(--mute);margin:0 0 12px;font-size:.85em}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font-weight:700;cursor:pointer}.tab.active{background:var(--acc);color:#1e1235}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;position:relative}
.label{color:var(--mute);font-size:.85em;margin-bottom:6px}input,select,textarea{width:100%;background:#122420;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:1em;outline:none}
.city-list{position:absolute;left:14px;right:14px;top:70px;background:#1e3a37;border:1px solid var(--line);border-radius:12px;max-height:200px;overflow:auto;z-index:20;display:none}
.city-list.open{display:block}.city-item{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}.city-item:hover{background:var(--okbg)}
.top{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}.top button{background:#122420;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px;font-size:.85em;font-weight:700;cursor:pointer}.top button.active{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.swap{position:absolute;right:20px;top:82px;background:var(--okbg);border:1px solid var(--ok);color:var(--ok);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5}
.chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 14px;border-radius:999px;font-size:.85em;cursor:pointer}.chip.active{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:10px;cursor:pointer}
.card.best{border:2px solid var(--ok);background:#1b2f2b}.head{display:flex;justify-content:space-between;align-items:center}.price{font-size:1.9em;font-weight:900}.badge{background:var(--ok);color:#0a2e16;padding:3px 10px;border-radius:20px;font-size:.65em;font-weight:800}
.mute{color:var(--mute);font-size:.85em}
.detail{display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:10px;animation:fade .2s}.detail.open{display:block}@keyframes fade{from{opacity:0}to{opacity:1}}
.line{display:flex;justify-content:space-between;margin:5px 0;font-size:.88em}
.btn{width:100%;padding:13px;border-radius:12px;border:none;background:var(--acc);color:#1e1235;font-weight:800;cursor:pointer;margin-top:8px}.btn2{background:transparent;border:1px solid var(--line);color:var(--ink)}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>Rota Viva</h1>
<p class="sub">Toque no card para ver detalhes</p>

<div class="tabs">
<button class="tab active" id="tabCalc" onclick="showTab('calc')">Calculadora</button>
<button class="tab" id="tabPlan" onclick="showTab('plan')">Anotações</button>
</div>

<div id="viewCalc">

<div class="panel" id="boxOrigem">
<div class="label">Origem</div>
<input id="origem" placeholder="Manaus, São Paulo..." oninput="buscar('origem')" onfocus="buscar('origem')">
<div class="city-list" id="listOrigem"></div>
<div class="swap" onclick="trocar()">↕</div>
</div>

<div class="panel" id="boxDestino">
<div class="label">Destino</div>
<input id="destino" placeholder="Itacoatiara, Belém..." oninput="buscar('destino')" onfocus="buscar('destino')">
<div class="city-list" id="listDestino"></div>
</div>

<div class="panel">
<div class="label">Período</div>
<select id="per" onchange="calc()"><option value="cheia">Cheia - normal</option><option value="seca" selected>Seca +25%</option></select>
</div>

<div class="panel">
<div class="label">Peso (pode digitar)</div>
<input id="carga" type="number" inputmode="decimal" value="0.5" step="0.01" oninput="syncPeso()">
<div class="top"><button id="b500" class="active" onclick="setW(0.5)">500kg</button><button id="b2" onclick="setW(2)">2 ton</button><button id="b14" onclick="setW(14)">14 ton</button></div>
<div style="margin-top:10px"><div class="label">Valor mercadoria</div><input id="vMerc" type="number" value="5000" oninput="calc()"></div>
<div class="chips"><button class="chip active" id="cBar" onclick="setC('barato')">Mais barato</button><button class="chip" id="cRap" onclick="setC('rapido')">Mais rápido</button><button class="chip" id="cEq" onclick="setC('eq')">Equilibrado</button></div>
</div>

<div id="res"></div>
</div>

<div id="viewPlan" class="hidden">
<div class="panel"><div class="label">Anotações</div><textarea id="anotacoes" rows="12"></textarea><button class="btn" onclick="salvarAnot()">Salvar</button></div>
</div>
</main>
<script>
const cidades=[
{name:"Manaus",uf:"AM",lat:-3.119,lon:-60.021},{name:"Itacoatiara",uf:"AM",lat:-3.143,lon:-58.444},{name:"Parintins",uf:"AM",lat:-2.628,lon:-56.735},{name:"Manacapuru",uf:"AM",lat:-3.289,lon:-60.62},
{name:"Belém",uf:"PA",lat:-1.455,lon:-48.504},{name:"Santarém",uf:"PA",lat:-2.443,lon:-54.708},{name:"Marabá",uf:"PA",lat:-5.368,lon:-49.117},
{name:"Porto Velho",uf:"RO",lat:-8.761,lon:-63.9},{name:"Boa Vista",uf:"RR",lat:2.823,lon:-60.675},{name:"Rio Branco",uf:"AC",lat:-9.975,lon:-67.824},{name:"Macapá",uf:"AP",lat:0.034,lon:-51.069},{name:"Palmas",uf:"TO",lat:-10.168,lon:-48.331},
{name:"São Paulo",uf:"SP",lat:-23.55,lon:-46.633},{name:"Rio de Janeiro",uf:"RJ",lat:-22.906,lon:-43.172},{name:"Brasília",uf:"DF",lat:-15.793,lon:-47.882},{name:"Belo Horizonte",uf:"MG",lat:-19.916,lon:-43.934},{name:"Curitiba",uf:"PR",lat:-25.429,lon:-49.267},{name:"Porto Alegre",uf:"RS",lat:-30.034,lon:-51.217},{name:"Salvador",uf:"BA",lat:-12.977,lon:-38.501},{name:"Recife",uf:"PE",lat:-8.047,lon:-34.877},{name:"Fortaleza",uf:"CE",lat:-3.717,lon:-38.543}
];
let origemSel=cidades[0], destinoSel=cidades[1];
function buscar(tipo){
 const input=document.getElementById(tipo); const list=document.getElementById(tipo=='origem'?'listOrigem':'listDestino');
 const q=input.value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
 const filtr=cidades.filter(c=>c.name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").includes(q)).slice(0,6);
 list.innerHTML=filtr.map(c=>`<div class="city-item" onclick="sel('${tipo}','${c.name}')"><b>${c.name}</b> - ${c.uf}</div>`).join('');
 list.className='city-list open';
}
function sel(tipo,nome){const c=cidades.find(x=>x.name==nome); if(tipo=='origem'){origemSel=c; origem.value=c.name+' - '+c.uf; listOrigem.className='city-list';}else{destinoSel=c; destino.value=c.name+' - '+c.uf; listDestino.className='city-list';}calc();}
function trocar(){const t=origemSel; origemSel=destinoSel; destinoSel=t; origem.value=origemSel.name+' - '+origemSel.uf; destino.value=destinoSel.name+' - '+destinoSel.uf; calc();}
document.addEventListener('click',e=>{if(!e.target.closest('#boxOrigem')) listOrigem.className='city-list'; if(!e.target.closest('#boxDestino')) listDestino.className='city-list';});
function distKm(a,b){const R=6371; const dLat=(b.lat-a.lat)*Math.PI/180; const dLon=(b.lon-a.lon)*Math.PI/180; const x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2; return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}

let crit='barato';
function showTab(t){viewCalc.className=t=='calc'?'':'hidden';viewPlan.className=t=='plan'?'':'hidden';tabCalc.className=t=='calc'?'tab active':'tab';tabPlan.className=t=='plan'?'tab active':'tab';}
function syncPeso(){const ton=parseFloat(carga.value)||0; document.querySelectorAll('.top button').forEach(b=>b.className=''); if(ton==0.5) b500.className='active'; else if(ton==2) b2.className='active'; else if(ton==14) b14.className='active'; calc();}
function setW(v){carga.value=v; syncPeso();}
function setC(c){crit=c; document.querySelectorAll('.chip').forEach(b=>b.className='chip'); document.getElementById(c=='barato'?'cBar':c=='rapido'?'cRap':'cEq').className='chip active'; calc();}
function calc(){
 const ton=parseFloat(carga.value)||0.5; const vMerc=parseFloat(document.getElementById('vMerc').value)||0; const km=distKm(origemSel,destinoSel); const mult=per.value=='seca'?1.25:1;
 function build(def,d,nome,desc){
  const freteBase=def*ton*mult*(km/270); const balsa=(km>700|| (origemSel.uf=='RO'&&destinoSel.uf=='AM')||(origemSel.uf=='AM'&&destinoSel.uf=='RO')) && nome!='Aéreo' ? 4800:0;
  const sub=freteBase+balsa; const icms=sub*0.12; const porto=ton*1000>=50?30:0; const seguro=vMerc*0.01; const afrmm=nome.includes('Hidro')?sub*0.08:0; const total=sub+icms+porto+seguro+afrmm;
  return {nome,def,d,desc,freteBase,balsa,icms,porto,seguro,afrmm,total,km};
 }
 const ehNorte=['AM','PA','RO','RR','AC','AP','TO'].includes(origemSel.uf)&&['AM','PA','RO','RR','AC','AP','TO'].includes(destinoSel.uf);
 const rodDef=ehNorte?428:220; const hidDef=ehNorte? (km<400?150:350):9999; const aerDef=ehNorte?1800:1200;
 const list=[build(rodDef,km/600+1,'Rodoviário AM-010','Caminhão 3 eixos 14ton = R$6.000'),hidDef<9000?build(hidDef,km/300+2,'Hidroviário Balsa','Balsa pequena, mais barato na cheia'):null,build(aerDef,0.5,'Aéreo','Avião táxi aéreo')].filter(Boolean);
 const best=crit=='barato'?list.reduce((a,b)=>a.total<b.total?a:b):crit=='rapido'?list.reduce((a,b)=>a.d<b.d?a:b):list.reduce((a,b)=>(a.total/500+a.d*50)<(b.total/500+b.d*50)?a:b);
 res.innerHTML=`<div class="mute" style="text-align:center;margin-bottom:6px">${origemSel.name} → ${destinoSel.name} • ${Math.round(km)}km</div>`+list.map((o,i)=>`
  <div class="card ${o.nome==best.nome?'best':''}" onclick="document.getElementById('det${i}').classList.toggle('open')">
    <div class="head"><div><b>${o.nome}</b> ${o.nome==best.nome?'<span class="badge">MELHOR</span>':''}</div><div class="price">R$ ${o.total.toFixed(2)}</div></div>
    <div class="detail" id="det${i}">
      <div class="mute" style="margin-bottom:8px">${o.d.toFixed(1)} dias • ${o.desc} • ${Math.round(o.km)}km</div>
      <div class="line"><span>Base R$${o.freieBase?o.freieBase.toFixed(0):o.freteBase.toFixed(0)} + Balsa ${o.balsa?`R$${o.balsa}`:'-'} </span></div>
      <div class="line"><span>ICMS 12% R$${o.icms.toFixed(0)} + Porto R$${o.porto.toFixed(0)} + Seguro R$${o.seguro.toFixed(0)} ${o.afrmm?`+ AFRMM R$${o.afrmm.toFixed(0)}`:''}</span></div>
      <div class="line"><span>R$ ${(o.total/(ton*1000)).toFixed(3)}/kg • ${ton*1000}kg = R$ ${o.total.toFixed(2)} total</span></div>
    </div>
  </div>
 `).join('');
}
origem.value=origemSel.name+' - '+origemSel.uf; destino.value=destinoSel.name+' - '+destinoSel.uf;
const txtArea=document.getElementById('anotacoes'); txtArea.value=localStorage.getItem('rv_anot')||''; 
function salvarAnot(){localStorage.setItem('rv_anot',txtArea.value); alert('Salvo');}
syncPeso();
</script>
</body>
</html>
