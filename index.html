<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rota Viva - Certo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui}
body{background:#000;color:#fff}
.top-score{background:#0a0a0a;border-bottom:1px solid #222;padding:10px 12px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}
.top-score div{text-align:center;flex:1}
.top-score .val{font-weight:800;font-size:13px;color:#fff}
.top-score .lbl{font-size:9px;color:#666}
.wrap{max-width:520px;margin:auto;padding:12px;padding-bottom:100px}
h1{text-align:center;padding:16px 0;font-size:24px}
.card{background:#111;border:1px solid #222;border-radius:16px;padding:14px;margin:12px 0}
.card.best{border:2px solid #8B5CF6}
.sel{background:#111;border:1px solid #333;border-radius:12px;padding:12px;width:100%;color:#fff;margin:6px 0;outline:none}
.s{font-size:11px;color:#666}.t{font-weight:800;font-size:15px}
.badge{background:#8B5CF6;color:#fff;font-size:10px;padding:3px 8px;border-radius:8px;margin-left:6px}
.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.label{font-size:12px;color:#22C55E;font-weight:800;margin:12px 0 4px 4px;display:block}
.pontuacao-card{background:#0f0f0f;border:1px solid #222;border-radius:12px;padding:10px;display:flex;justify-content:space-between;margin-top:8px}
.route-origin{font-size:11px;color:#8B5CF6;font-weight:700;margin-bottom:6px}
.btn{padding:10px 14px;border-radius:12px;border:1px solid #2a2a2a;background:#151515;color:#aaa;font-weight:600;cursor:pointer}
.btn-purple{background:#8B5CF6;color:#fff;border:none;font-weight:800;width:100%;margin-top:8px;padding:12px;border-radius:12px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#000;display:flex;border-top:1px solid #1a1a1a}
.tabs button{flex:1;padding:14px;background:none;border:none;color:#555;font-weight:700}
.tabs button.active{color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;padding:16px;z-index:99}
.modal.show{display:flex}
.modal-box{background:#111;border:1px solid #333;border-radius:16px;padding:16px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
.pago{color:#22C55E;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);padding:6px 12px;border-radius:20px;font-size:13px;font-weight:700}
.naopago{color:#EF4444;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);padding:6px 12px;border-radius:20px;font-size:13px;font-weight:700}
</style>
</head>
<body>

<div class="top-score" id="topScore">
  <div><div class="lbl">PESO</div><div class="val" id="topPeso">1000kg</div></div>
  <div><div class="lbl">TON</div><div class="val" id="topTon">1.000t</div></div>
  <div><div class="lbl">DISTÂNCIA</div><div class="val" id="topDist">63km</div></div>
  <div><div class="lbl">CARGA</div><div class="val" id="topValor">R$ 10000</div></div>
</div>

<div class="wrap">
<h1>Rota Viva</h1>

<div class="card" style="padding:12px">
<div class="row"><div style="flex:1"><div class="s">Peso (kg)</div><input id="peso" type="number" value="1000" class="sel"></div><div style="flex:1;margin-left:8px"><div class="s">Valor carga (R$)</div><input id="valorCarga" type="number" value="10000" class="sel"></div></div>
</div>

<label class="label">Origem</label>
<select id="origem" class="sel"></select>
<label class="label">Destino</label>
<select id="destino" class="sel"></select>

<div id="cards"></div>

<div id="anotacoes" style="display:none">
<h3 style="margin:12px 0">Alternativas</h3>
<input id="altNome" class="sel" placeholder="Ex: Balsa">
<input id="altValor" type="number" class="sel" placeholder="Valor R$">
<div style="display:flex;gap:8px;margin:10px 0"><button id="chipPago" class="btn" style="border-color:#22C55E;color:#22C55E">● Pago</button><button id="chipNao" class="btn" style="border-color:#EF4444;color:#EF4444">● Não pago</button></div>
<textarea id="altObs" class="sel" rows="2" placeholder="Obs"></textarea>
<button id="salvarAlt" class="btn-purple">Salvar Alternativa</button>
<div style="display:flex;gap:8px;margin:14px 0 8px"><button class="btn" id="filtroAtivas" style="border-color:#8B5CF6;color:#fff">Ativas</button><button class="btn" id="filtroLixeira">🗑 Lixeira</button></div>
<div id="listaAlt"></div>
</div>

<div id="configImpostos" style="display:none">
<h3 style="margin:12px 0">Impostos por Modal</h3>
<div id="listaImpostos"></div>
</div>
</div>

<div class="tabs"><button id="tabRotas" class="active">Rotas</button><button id="tabAnot">Alternativas</button><button id="tabImpostos">Impostos</button></div>
<div id="modalDetalhe" class="modal"><div class="modal-box" id="detalheBox"></div></div>
<div id="modalEdit" class="modal"><div class="modal-box" id="editBox"></div></div>

<script type="module">
import Decimal from 'https://cdn.jsdelivr.net/npm/decimal.js@10.4.3/+esm';

const distReal = {
  "Itacoatiara-Itapiranga": 63, "Itapiranga-Itacoatiara": 63,
  "Manaus-Itacoatiara": 270, "Itacoatiara-Manaus": 270,
  "Itacoatiara-Ji-Paraná": 1647, "Ji-Paraná-Itacoatiara": 1647,
  "Manaus-Ji-Paraná": 1500, "Ji-Paraná-Manaus": 1500,
  "Itacoatiara-Parintins": 250, "Parintins-Itacoatiara": 250,
  "Manaus-Belém": 1800, "Belém-Manaus": 1800,
  "Porto Velho-Manaus": 900, "Manaus-Porto Velho": 900,
};
function getDist(o,d){ return distReal[`${o}-${d}`] || 800; }

const defaultImpostos = {
  "Rodoviário": {icms: 12, pis: 1.65, cofins: 7.6, seguro: 2.0, ccd: 4.6875, cc: 519.67, obs:"ANTT 2025 - 3 eixos Carga Geral R$ 4,6875/km"},
  "Hidroviário (balsa/navio)": {icms: 7, pis: 1.65, cofins: 7.6, seguro: 1.5, ccd: 1.5, cc: 800, obs:"Balsa: R$ 1,50/km rio + R$ 4.500 travessia"},
  "Aéreo": {icms: 4, pis: 1.65, cofins: 7.6, seguro: 1.0, ccd: 12.0, cc: 400, obs:"Aéreo R$ 12/km"},
  "Multimodal (rio+estrada)": {icms: 9, pis: 1.65, cofins: 7.6, seguro: 1.8, ccd: 3.2, cc: 650, obs:"Média"}
};
function getImpostos(){ return JSON.parse(localStorage.getItem('impostosV2')||JSON.stringify(defaultImpostos)); }
function setImpostos(v){ localStorage.setItem('impostosV2', JSON.stringify(v)); }

const cidades=["Manaus","Belém","Porto Velho","Itacoatiara","Itapiranga","Parintins","Ji-Paraná","Ariquemes","Vilhena","Ananindeua","Marabá","Santarém","Urucurituba","Silves","Urucará","São Sebastião do Uatumã"];
const selO=document.getElementById('origem'), selD=document.getElementById('destino');
cidades.forEach(c=>{selO.innerHTML+=`<option>${c}</option>`; selD.innerHTML+=`<option>${c}</option>`});
selO.value="Itacoatiara"; selD.value="Itapiranga";
let statusAtual='Pago';
chipPago.onclick=()=>{statusAtual='Pago';}; chipNao.onclick=()=>{statusAtual='Não pago';};

function calc(){
  const pesoVal=parseFloat(document.getElementById('peso').value)||0;
  const valorVal=parseFloat(document.getElementById('valorCarga').value)||0;
  const peso=new Decimal(pesoVal);
  const valor=new Decimal(valorVal);
  const dist=getDist(selO.value, selD.value);
  const ton=peso.div(1000);

  // TOPO - pontos separados em cima
  document.getElementById('topPeso').textContent=pesoVal+"kg";
  document.getElementById('topTon').textContent=ton.toFixed(3)+"t";
  document.getElementById('topDist').textContent=dist+"km";
  document.getElementById('topValor').textContent="R$ "+valorVal;

  const impostos=getImpostos();
  const rotas=Object.keys(impostos).map(nome=>{
    const imp=impostos[nome];
    // FORMULA CERTA ANTT: CCD * km + CC
    const freteANTT=new Decimal(imp.ccd).times(dist).plus(imp.cc);
    const base=freteANTT;
    const seguro=valor.times(new Decimal(imp.seguro).div(100));
    const pis=base.times(new Decimal(imp.pis).div(100));
    const cofins=base.times(new Decimal(imp.cofins).div(100));
    const icmsDec=new Decimal(imp.icms).div(100);
    const icmsVal=icmsDec.eq(1)?new Decimal(0): base.div(new Decimal(1).minus(icmsDec)).minus(base);
    const total=base.plus(icmsVal).plus(seguro).plus(pis).plus(cofins);
    const precoKg=peso.gt(0)?total.div(peso):new Decimal(0);
    const precoTon=ton.gt(0)?total.div(ton):new Decimal(0);
    let prazo= nome.includes('Aéreo')?1: Math.max(1,Math.ceil(dist/300));
    if(nome.includes('Hidro')) prazo=Math.max(1,Math.ceil(dist/150));
    return {nome, dist, freteANTT:freteANTT.toDecimalPlaces(2).toNumber(), base:base.toDecimalPlaces(2).toNumber(), icmsVal:icmsVal.toDecimalPlaces(2).toNumber(), seguro:seguro.toDecimalPlaces(2).toNumber(), pis:pis.toDecimalPlaces(2).toNumber(), cofins:cofins.toDecimalPlaces(2).toNumber(), total:total.toDecimalPlaces(2).toNumber(), precoKg:precoKg.toDecimalPlaces(2).toNumber(), precoTon:precoTon.toDecimalPlaces(2).toNumber(), prazo, imp, nota:Math.max(10,100-Math.floor(total.div(100).toNumber()))};
  });
  rotas.sort((a,b)=>a.total-b.total);
  document.getElementById('cards').innerHTML=rotas.map((r,i)=>`
    <div class="card ${i===0?'best':''}" onclick="showDetalhe('${r.nome}')">
      <div class="route-origin">${selO.value} → ${selD.value} • ${r.dist}km real ANTT</div>
      <div class="row"><span class="t">${r.nome} ${i===0?'<span class=badge>MELHOR</span>':''}</span><span class="t">${r.nota}/100</span></div>
      <div class="pontuacao-card">
        <div><div class="s">Total</div><div class="t">R$ ${r.total.toLocaleString('pt-BR')}</div></div>
        <div><div class="s">R$/kg</div><div class="t">R$ ${r.precoKg}</div></div>
        <div><div class="s">R$/ton</div><div class="t">R$ ${r.precoTon}</div></div>
        <div><div class="s">Prazo</div><div class="t">${r.prazo}d</div></div>
      </div>
      <div class="s" style="margin-top:8px">CCD R$ ${r.imp.ccd}/km x ${r.dist}km + CC R$ ${r.imp.cc} | ICMS ${r.imp.icms}%</div>
    </div>
  `).join('');
  window._rotas=rotas;
}

window.showDetalhe=(nome)=>{
  const r=window._rotas.find(x=>x.nome===nome);
  detalheBox.innerHTML=`<h3>${r.nome}</h3><div class="route-origin">${selO.value} → ${selD.value} • ${r.dist}km</div><div style="font-size:13px;line-height:1.8;margin-top:12px"><b>CALCULO ANTT REAL:</b><br>ANTT 2025: CCD R$ ${r.imp.ccd}/km + CC R$ ${r.imp.cc}<br>Frete = ${r.imp.ccd} x ${r.dist} + ${r.imp.cc} = <b>R$ ${r.freteANTT}</b><br>+ ICMS ${r.imp.icms}% = R$ ${r.icmsVal}<br>+ Seguro ${r.imp.seguro}% = R$ ${r.seguro}<br>+ PIS ${r.imp.pis}% + COFINS ${r.imp.cofins}%<br><br><b>TOTAL: R$ ${r.total}</b><br>R$/kg R$ ${r.precoKg} | R$/ton R$ ${r.precoTon}<br><br>Agora cidade longa muda muito: 63km = R$ ~800, 1647km = R$ ~8.500</div><br><button onclick="modalDetalhe.classList.remove('show')" class="sel">Fechar</button>`;
  modalDetalhe.classList.add('show');
};

function renderImpostos(){
  const imps=getImpostos();
  listaImpostos.innerHTML=Object.keys(imps).map(n=>{
    const imp=imps[n]; return `<div class="card" onclick="editImposto('${n}')"><div class="t">${n}</div><div class="s">CCD R$ ${imp.ccd}/km | CC R$ ${imp.cc} | ICMS ${imp.icms}% | PIS ${imp.pis}% | COFINS ${imp.cofins}% | Seguro ${imp.seguro}%</div><div class="s" style="color:#8B5CF6">toque para editar %</div></div>`;
  }).join('');
}
window.editImposto=(nome)=>{
  const imps=getImpostos(); const imp=imps[nome];
  editBox.innerHTML=`<h3>${nome}</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
    <div><label class="label">ICMS %</label><input id="e_icms" type="number" step="0.1" value="${imp.icms}" class="sel"></div>
    <div><label class="label">PIS %</label><input id="e_pis" type="number" step="0.01" value="${imp.pis}" class="sel"></div>
    <div><label class="label">COFINS %</label><input id="e_cofins" type="number" step="0.1" value="${imp.cofins}" class="sel"></div>
    <div><label class="label">Seguro %</label><input id="e_seguro" type="number" step="0.1" value="${imp.seguro}" class="sel"></div>
    <div><label class="label">CCD R$/km</label><input id="e_ccd" type="number" step="0.01" value="${imp.ccd}" class="sel"></div>
    <div><label class="label">CC R$ (carga/descarga)</label><input id="e_cc" type="number" value="${imp.cc}" class="sel"></div>
  </div><button onclick="salvarImposto('${nome}')" class="btn-purple">Salvar alteração</button><button onclick="modalEdit.classList.remove('show')" class="sel" style="margin-top:8px">Cancelar</button>`;
  modalEdit.classList.add('show');
};
window.salvarImposto=(nome)=>{
  const imps=getImpostos();
  imps[nome].icms=parseFloat(document.getElementById('e_icms').value)||0;
  imps[nome].pis=parseFloat(document.getElementById('e_pis').value)||0;
  imps[nome].cofins=parseFloat(document.getElementById('e_cofins').value)||0;
  imps[nome].seguro=parseFloat(document.getElementById('e_seguro').value)||0;
  imps[nome].ccd=parseFloat(document.getElementById('e_ccd').value)||0;
  imps[nome].cc=parseFloat(document.getElementById('e_cc').value)||0;
  setImpostos(imps); modalEdit.classList.remove('show'); renderImpostos(); calc();
};

peso.addEventListener('change',calc); valorCarga.addEventListener('change',calc);
origem.addEventListener('change',calc); destino.addEventListener('change',calc);
calc(); renderImpostos();
modalDetalhe.addEventListener('click',e=>{ if(e.target.id==='modalDetalhe') e.target.classList.remove('show'); });
modalEdit.addEventListener('click',e=>{ if(e.target.id==='modalEdit') e.target.classList.remove('show'); });

function getAlts(){ return JSON.parse(localStorage.getItem('alts')||'[]'); }
function setAlts(a){ localStorage.setItem('alts',JSON.stringify(a)); }
function loadAlts(){ const alts=getAlts(); const f=alts.filter(a=> view==='ativas' ? !a.lixeira : a.lixeira); listaAlt.innerHTML=f.length?f.map(a=>{ const idx=alts.indexOf(a); return `<div class="card"><div class="row"><span class="t">${a.nome}</span><span class="${a.status==='Pago'?'pago':'naopago'}">${a.status}</span></div><div class="s">R$ ${a.valor} • ${a.obs||''} • ${a.data}</div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn" onclick="togglePago(${idx})">${a.status==='Pago'?'Marcar Não pago':'Marcar Pago'}</button><button class="btn" onclick="toTrash(${idx})">🗑 Apagar</button></div></div>`;}).join(''):'<div style="color:#555;text-align:center;padding:12px">Nenhuma</div>'; }
let view='ativas';
window.togglePago=(i)=>{ const a=getAlts(); a[i].status=a[i].status==='Pago'?'Não pago':'Pago'; setAlts(a); loadAlts(); };
window.toTrash=(i)=>{ const a=getAlts(); a[i].lixeira=true; setAlts(a); loadAlts(); };
salvarAlt.onclick=()=>{const nome=altNome.value.trim(); if(!nome) return alert('Nome'); const a=getAlts(); a.unshift({nome, valor:altValor.value, obs:altObs.value, status:statusAtual, data:new Date().toLocaleDateString(), lixeira:false}); setAlts(a); altNome.value=''; altValor.value=''; altObs.value=''; loadAlts();};
filtroAtivas.onclick=()=>{view='ativas'; loadAlts();}; filtroLixeira.onclick=()=>{view='lixeira'; loadAlts();};
tabRotas.onclick=()=>{cards.style.display=''; anotacoes.style.display='none'; configImpostos.style.display='none'; tabRotas.classList.add('active'); tabAnot.classList.remove('active'); tabImpostos.classList.remove('active');};
tabAnot.onclick=()=>{cards.style.display='none'; anotacoes.style.display=''; configImpostos.style.display='none'; tabAnot.classList.add('active'); tabRotas.classList.remove('active'); tabImpostos.classList.remove('active'); loadAlts();};
tabImpostos.onclick=()=>{cards.style.display='none'; anotacoes.style.display='none'; configImpostos.style.display=''; tabImpostos.classList.add('active'); tabRotas.classList.remove('active'); tabAnot.classList.remove('active'); renderImpostos();};
</script>
</body>
</html>
