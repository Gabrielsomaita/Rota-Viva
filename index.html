<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<title>Rota Viva</title>
<style>
:root{--bg:#0e1e1c;--card:#1a2e2b;--line:#243e3a;--ink:#e6f0ee;--mute:#8aa39e;--acc:#c4a4ff;--ok:#4ade80;--okbg:#143d2a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;padding:0 14px 24px}
main{max-width:620px;margin:0 auto}h1{text-align:center;margin:24px 0 4px;font-size:2em}.sub{text-align:center;color:var(--mute);margin:0 0 14px;font-size:.9em}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font-weight:700;cursor:pointer}.tab.active{background:var(--acc);color:#1e1235}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;position:relative}
.label{color:var(--mute);font-size:.85em;margin-bottom:8px}select,input,textarea{width:100%;background:#122420;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:13px 14px;font-size:1em;outline:none}
.city-list{position:absolute;left:16px;right:16px;top:72px;background:#1e3a37;border:1px solid var(--line);border-radius:12px;max-height:220px;overflow:auto;z-index:20;display:none}
.city-list.open{display:block}.city-item{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}.city-item:hover{background:var(--okbg)}
.top{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.top button{background:#122420;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:10px;font-size:.9em;font-weight:700;cursor:pointer}.top button.active{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.swap{position:absolute;right:22px;top:84px;background:var(--okbg);border:1px solid var(--ok);color:var(--ok);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:800;z-index:5}
.chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:10px 18px;border-radius:999px;cursor:pointer}.chip.active{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:10px;cursor:pointer}.card.best{border:2px solid var(--ok);background:#1b2f2b}.head{display:flex;justify-content:space-between;align-items:center}.price{font-size:1.8em;font-weight:900}.badge{background:var(--ok);color:#0a2e16;padding:3px 10px;border-radius:20px;font-size:.7em;font-weight:800}
.mute{color:var(--mute);font-size:.85em}.detail{display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.detail.open{display:block}.line{display:flex;justify-content:space-between;margin:6px 0;font-size:.9em}
.btn{width:100%;padding:14px;border-radius:12px;border:none;background:var(--acc);color:#1e1235;font-weight:800;cursor:pointer;margin-top:10px}.btn2{background:transparent;border:1px solid var(--line);color:var(--ink)}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>Rota Viva</h1>
<p class="sub">Toque no card para ver impostos</p>

<div class="tabs">
<button class="tab active" id="tabCalc" onclick="showTab('calc')">Calculadora</button>
<button class="tab" id="tabPlan" onclick="showTab('plan')">Anotações</button>
</div>

<div id="viewCalc">

<!-- ORIGEM E DESTINO COM BUSCA - NO LUGAR DO TRAJETO ANTIGO -->
<div class="panel" id="boxOrigem">
<div class="label">Origem</div>
<input id="origem" placeholder="Digite: Manaus, São Paulo, Belém..." oninput="buscar('origem')" onfocus="buscar('origem')">
<div class="city-list" id="listOrigem"></div>
<div class="swap" onclick="trocar()">↕</div>
</div>

<div class="panel" id="boxDestino">
<div class="label">Destino</div>
<input id="destino" placeholder="Digite: Itacoatiara, Porto Velho..." oninput="buscar('destino')" onfocus="buscar('destino')">
<div class="city-list" id="listDestino"></div>
</div>

<!-- PERIODO SEPARADO COMO ESTAVA -->
<div class="panel">
<div class="label">Período / Rio</div>
<select id="per" onchange="calc()"><option value="cheia">Cheia - normal</option><option value="seca" selected>Seca - taxa +25%</option></select>
</div>

<!-- QUANTIDADE COMO ESTAVA ANTES - COM TECLADO -->
<div class="panel">
<div class="label">Quantidade (pode digitar qualquer peso)</div>
<input id="carga" type="number" inputmode="decimal" value="0.5" step="0.01" oninput="syncPeso()">
<div class="mute" id="kgHelp" style="margin-top:6px">500kg = 10 sacas farinha</div>
<div class="top">
<button id="b500" class="active" onclick="setW(0.5)">500kg</button>
<button id="b2" onclick="setW(2)">2 ton</button>
<button id="b14" onclick="setW(14)">14 ton</button>
</div>
<div style="margin-top:14px">
<div class="label">Valor da mercadoria (para seguro 1%)</div>
<input id="vMerc" type="number" inputmode="numeric" value="5000" oninput="calc()">
</div>
</div>

<!-- O QUE IMPORTA COMO ESTAVA -->
<div class="panel">
<div class="label">O que importa?</div>
<div class="chips">
<button class="chip active" id="cBar" onclick="setC('barato')">Mais barato</button>
<button class="chip" id="cRap" onclick="setC('rapido')">Mais rápido</button>
<button class="chip" id="cEq" onclick="setC('eq')">Equilibrado</button>
</div>
</div>

<div id="res"></div>
</div>

<div id="viewPlan" class="hidden">
<div class="panel">
<div class="label">Anotações de logística - fica salvo</div>
<textarea id="anotacoes" rows="12" placeholder="Escreve aqui livre..."></textarea>
<button class="btn" onclick="salvarAnot()">Salvar</button>
<button class="btn btn2" onclick="exportTxt()">Exportar</button>
<div class="mute" id="saveMsg" style="text-align:center;margin-top:8px"></div>
</div>
</div>
</main>
<script>
const cidades=[
{name:"Manaus",uf:"AM",lat:-3.119,lon:-60.021},{name:"Itacoatiara",uf:"AM",lat:-3.143,lon:-58.444},{name:"Parintins",uf:"AM",lat:-2.628,lon:-56.735},{name:"Manacapuru",uf:"AM",lat:-3.289,lon:-60.62},
{name:"Belém",uf:"PA",lat:-1.455,lon:-48.504},{name:"Santarém",uf:"PA",lat:-2.443,lon:-54.708},{name:"Marabá",uf:"PA",lat:-5.368,lon:-49.117},{name:"Ananindeua",uf:"PA",lat:-1.365,lon:-48.372},
{name:"Porto Velho",uf:"RO",lat:-8.761,lon:-63.9},{name:"Ji-Paraná",uf:"RO",lat:-10.877,lon:-61.932},{name:"Boa Vista",uf:"RR",lat:2.823,lon:-60.675},{name:"Rio Branco",uf:"AC",lat:-9.975,lon:-67.824},{name:"Macapá",uf:"AP",lat:0.034,lon:-51.069},{name:"Palmas",uf:"TO",lat:-10.168,lon:-48.331},
{name:"São Paulo",uf:"SP",lat:-23.55,lon:-46.633},{name:"Rio de Janeiro",uf:"RJ",lat:-22.906,lon:-43.172},{name:"Brasília",uf:"DF",lat:-15.793,lon:-47.882},{name:"Belo Horizonte",uf:"MG",lat:-19.916,lon:-43.934},{name:"Curitiba",uf:"PR",lat:-25.429,lon:-49.267},{name:"Porto Alegre",uf:"RS",lat:-30.034,lon:-51.217},{name:"Salvador",uf:"BA",lat:-12.977,lon:-38.501},{name:"Recife",uf:"PE",lat:-8.047,lon:-34.877},{name:"Fortaleza",uf:"CE",lat:-3.717,lon:-38.543},{name:"Goiânia",uf:"GO",lat:-16.686,lon:-49.264},{name:"Cuiabá",uf:"MT",lat:-15.601,lon:-56.097},{name:"Campo Grande",uf:"MS",lat:-20.469,lon:-54.62}
];
let origemSel=cidades[0], destinoSel=cidades[1];
