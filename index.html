<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<title>Rota Viva v2 - KG + Cambio + Frete Local</title>
<style>
:root{--bg:#e8efec;--card:#f7faf8;--ink:#10302f;--mute:#4d6663;--line:#c3d3cd;--acc:#5a2a6b;--accink:#fff;--bad:#a33}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,sans-serif;padding:16px}
main{max-width:760px;margin:0 auto}
h1{font-size:2em;margin:10px 0}
.lead{color:var(--mute);margin:0 0 22px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:4px}
select,input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.row{display:flex;gap:8px}
.badge{background:#a78bfa;color:#0f2320;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:bold}
.price{border-left:4px solid var(--acc);padding:8px 14px;background:var(--bg);border-radius:8px;margin:8px 0}
</style>
</head>
<body>
<main>
<h1>Rota Viva v2</h1>
<p class="lead">Compare rio, estrada, avião. Agora com KG, toneladas, câmbio e preço estimado por local.</p>

<section class="panel">
<div class="grid">
<div><label>Trajeto</label><select id="rt">
<option value="itacoatiara-manaus">Itacoatiara → Manaus</option>
<option value="manaus-belem">Manaus → Belém</option>
<option value="manaus-porto-velho">Manaus → Porto Velho</option>
<option value="manaus-santos">Manaus → Santos</option>
</select></div>
<div><label>Carga</label>
<div class="row">
<input id="carga" type="number" value="500" min="1">
<select id="unidade" style="max-width:110px"><option value="kg">KG</option><option value="ton">TON</option></select>
</div></div>
</div>
<div class="grid" style="margin-top:12px">
<div><label>Câmbio</label>
<div class="row">
<select id="moeda"><option value="BRL">BRL</option><option value="USD">USD</option></select>
<select id="cot" style="max-width:110px"><option value="5.5">5,50</option><option value="5.0">5,00</option><option value="6.0">6,00</option></select>
</div></div>
<div><label>Período</label><select id="periodo"><option value="cheia">Cheia</option><option value="seca">Seca (+25%)</option></select></div>
</div>
</section>

<section class="panel" id="resultado"></section>
</main>
<script>
const base={
"itacoatiara-manaus":{rod:{c:103,d:1},hidro:{c:43,d:2.8},aereo:{c:736,d:1.3}},
"manaus-belem":{rod:{c:0,d:0},hidro:{c:180,d:5},aereo:{c:1200,d:2}},
"manaus-porto-velho":{rod:{c:450,d:3},hidro:{c:220,d:7},aereo:{c:1500,d:2}},
"manaus-santos":{rod:{c:1800,d:8},hidro:{c:0,d:0},aereo:{c:4000,d:3}}
};
function calc(){
const t=document.getElementById('rt').value;
const raw=parseFloat(document.getElementById('carga').value)||0;
const uni=document.getElementById('unidade').value;
const moeda=document.getElementById('moeda').value;
const cot=parseFloat(document.getElementById('cot').value);
const per=document.getElementById('periodo').value;
const ton=uni==='kg'?raw/1000:raw;
const mult=per==='seca'?1.25:1;
const d=base[t];
function fmt(v){if(!v)return'-';let tot=v*ton*mult;return moeda==='USD'?`US$ ${(tot/cot).toFixed(2)} (R$ ${tot.toFixed(2)})`:`R$ ${tot.toFixed(2)}`}
function fmtKg(v){if(!v)return'-';let kg=v/1000*mult;return moeda==='USD'?`US$ ${(kg/cot).toFixed(4)}/kg`:`R$ ${kg.toFixed(3)}/kg`}
const nome=document.getElementById('rt').selectedOptions[0].text;
document.getElementById('resultado').innerHTML=`
<b>Frete estimado para ${raw} ${uni.toUpperCase()} em ${nome} na ${per}</b><br><small style="color:var(--mute)">${ton} toneladas equivalentes. Valor por local calculado com base em custo médio por tonelada.</small>
<div class="price"><div style="display:flex;justify-content:space-between"><b>Rodoviário</b><span class="badge">${d.rod.d||'-'} dias</span></div>Total: <b>${fmt(d.rod.c)}</b><br>Por KG: <b>${fmtKg(d.rod.c)}</b></div>
<div class="price"><div style="display:flex;justify-content:space-between"><b>Hidroviário</b><span class="badge">${d.hidro.d||'-'} dias</span></div>Total: <b>${fmt(d.hidro.c)}</b><br>Por KG: <b>${fmtKg(d.hidro.c)}</b><br><small>Na seca balsa leva menos, preço sobe.</small></div>
<div class="price"><div style="display:flex;justify-content:space-between"><b>Aéreo</b><span class="badge">rápido</span></div>Total: <b>${fmt(d.aereo.c)}</b><br>Por KG: <b>${fmtKg(d.aereo.c)}</b><br>Câmbio: ${moeda} @ ${cot}</div>
<div style="margin-top:10px;font-size:11px;color:var(--mute)">Estimativa local: custo base x sua carga. Para Itacoatiara/Manaus confirme com transportadora local. Isso ajuda a negociar frete.</div>
`;
}
document.querySelectorAll('select,input').forEach(e=>e.addEventListener('input',calc));
document.querySelectorAll('select').forEach(e=>e.addEventListener('change',calc));
calc();
</script>
</body>
</html>
