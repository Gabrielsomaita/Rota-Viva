                                                 <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<title>Rota Viva</title>
<style>
:root{--bg:#0c1c1a;--card:#172d2a;--line:#233f3c;--ink:#e6f0ee;--mute:#8aa39e;--acc:#c4a4ff;--ok:#4ade80;--teal:#4db6ac;--red:#ef9a9a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;padding:0 14px 24px}
main{max-width:620px;margin:0 auto}h1{text-align:center;margin:20px 0 4px}.sub{text-align:center;color:var(--mute);margin:0 0 12px;font-size:.85em}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{flex:1;padding:11px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font-weight:700;cursor:pointer}.tab.active{background:var(--acc);color:#1e1235}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;position:relative}
.label{color:var(--mute);font-size:.82em;margin-bottom:6px}input,select,textarea{width:100%;background:#122420;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:11px 12px;font-size:.95em;outline:none}
.city-list{position:absolute;left:12px;right:12px;top:66px;background:#1e3a37;border:1px solid var(--line);border-radius:12px;max-height:200px;overflow:auto;z-index:20;display:none}.city-list.open{display:block}.city-item{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.swap{position:absolute;right:18px;top:78px;background:#1a3a37;border:1px solid var(--teal);color:var(--teal);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5}
.top{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}.top button{background:#122420;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px;font-size:.85em;font-weight:700;cursor:pointer}.top button.active{border-color:var(--ok);background:#143d2a;color:var(--ok)}
.chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 12px;border-radius:999px;font-size:.82em;cursor:pointer}.chip.active{border-color:var(--teal);background:#143d2a;color:var(--teal)}

/* FACE IGUAL DA PRINT */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.card.best{border:1.5px solid var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.card-title{font-size:1.15em;font-weight:800}.card-score{font-size:1.4em;font-weight:900}.card-score span{font-size:.7em;color:var(--mute);font-weight:600}
.bar{height:8px;background:#2a4441;border-radius:99px;overflow:hidden;margin-bottom:12px}.bar-fill{height:100%;background:var(--teal);border-radius:99px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}.grid .k{color:var(--mute);font-size:.8em}.grid .v{font-size:.95em;font-weight:600;margin-top:2px}
.alert{margin-top:10px;color:var(--red);font-size:.88em;line-height:1.3}
.detail{display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.detail.open{display:block}.line{display:flex;justify-content:space-between;margin:4px 0;font-size:.85em}
.btn{width:100%;padding:12px;border-radius:10px;border:none;background:var(--acc);color:#1e1235;font-weight:800;cursor:pointer;margin-top:8px}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>Rota Viva</h1>
<p class="sub">Busca de cidade + toque no card pra ver impostos</p>

<div class="tabs">
<button class="tab active" id="tabCalc" onclick="showTab('calc')">Calculadora</button>
<button class="tab" id="tabPlan" onclick="showTab('plan')">Anotações</button>
</div>

<div id="viewCalc">

<div class="panel" id="boxOrigem">
<div class="label">Origem</div>
<input id="origem" placeholder="Manaus, São Paulo..." oninput="buscar('origem')" onfocus="buscar('origem')">
<div class="city-list" id="listOrigem"></div>
<div class="swap" onclick="trocar()">↕</div>
</div>

<div class="panel" id="boxDestino">
<div class="label">Destino</div>
<input id="destino" placeholder="Itacoatiara, Belém..." oninput="buscar('destino')" onfocus="buscar('destino')">
<div class="city-list" id="listDestino"></div>
</div>

<div class="panel">
<div class="label">Período / Peso</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<select id="per" onchange="calc()"><option value="cheia">Cheia</option><option value="seca" selected>Seca +25%</option></select>
<input id="carga" type="number" inputmode="decimal" value="0.5" step="0.01" oninput="calc()">
</div>
<div class="top"><button id="b500" class="active" onclick="setW(0.5)">500kg</button><button id="b2" onclick="setW(2)">2 ton</button><button id="b14" onclick="setW(14)">14 ton</button></div>
<div class="chips"><button class="chip active" id="cBar" onclick="setC('barato')">Mais barato</button><button class="chip" id="cRap" onclick="setC('rapido')">Mais rápido</button><button class="chip" id="cEq" onclick="setC('eq')">Equilibrado</button><button class="chip" id="cVer" onclick="setC('verde')">Mais verde</button></div>
</div>

<div id="res"></div>
</div>

<div id="viewPlan" class="hidden">
<div class="panel"><div class="label">Anotações livres</div><textarea id="anotacoes" rows="12" placeholder="Cliente, peso, valor..."></textarea><button class="btn" onclick="salvarAnot()">Salvar</button></div>
</div>
</main>
