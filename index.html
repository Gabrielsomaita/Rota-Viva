<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1b1a">
<title>Rota Viva</title>
<style>
:root{--bg:#0e1b1a;--card:#162624;--card2:#1c302d;--line:#2b423f;--tx:#eaf4f2;--mut:#9bb2ae;--ac:#c4a1ff;--acd:#21113d;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--r:16px}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px 16px 48px;max-width:560px;margin:0 auto}
h1{font-size:28px;letter-spacing:-.5px}
.sub{color:var(--mut);font-size:14px;margin:2px 0 16px}
.tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:14px;margin-bottom:16px;position:sticky;top:8px;z-index:5;border:1px solid var(--line)}
.tabs button{flex:1;padding:11px;border:0;border-radius:10px;background:none;color:var(--mut);font:600 15px inherit;font-family:inherit}
.tabs button[aria-selected=true]{background:var(--ac);color:#1a0b33}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.sec h2{font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.n{width:24px;height:24px;border-radius:50%;background:var(--ac);color:#1a0b33;font-size:13px;font-weight:700;display:grid;place-items:center;flex:none}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
label:first-of-type{margin-top:0}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:13px;font:16px inherit;font-family:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
textarea{min-height:72px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--mut);margin-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:999px;padding:10px 14px;font:500 14px inherit;font-family:inherit}
.chip[aria-pressed=true]{background:var(--acd);border-color:var(--ac);color:var(--ac);font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg .chip{border-radius:12px;text-align:left;padding:12px}
.seg small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.res-title{font-size:17px;margin:20px 0 10px}
.opt{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.opt.best{border:2px solid var(--ac);background:var(--acd)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.name{font-weight:700;font-size:17px}
.badge{background:var(--ok);color:#052e16;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;margin-left:8px}
