<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<title>Rota Viva</title>
<style>
:root{--bg:#0e1e1c;--card:#1a2e2b;--line:#243e3a;--ink:#e6f0ee;--mute:#8aa39e;--acc:#c4a4ff;--ok:#4ade80;--okbg:#143d2a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;padding:0 14px 24px}
main{max-width:620px;margin:0 auto}h1{text-align:center;margin:22px 0 4px;font-size:2em}.sub{text-align:center;color:var(--mute);margin:0 0 12px;font-size:.9em}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font-weight:700;cursor:pointer}.tab.active{background:var(--acc);color:#1e1235}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:10px;position:relative}
.label{color:var(--mute);font-size:.85em;margin-bottom:8px;display:flex;justify-content:space-between}input,select,textarea{width:100%;background:#122420;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:13px 14px;font-size:1em;outline:none}
input:focus{border-color:var(--ok)}
.city-list{position:absolute;top:78px;left:16px;right:16px;background:#1e3a37;border:1px solid var(--line);border-radius:12px;max-height:240px;overflow:auto;z-index:20;display:none}
.city-list.open{display:block}.city-item{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between}.city-item:hover{background:var(--okbg)}.city-item small{color:var(--mute)}
.swap{position:absolute;right:22px;top:38px;background:var(--okbg);border:1px solid var(--ok);color:var(--ok);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:800;z-index:5}
.top{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.top button{background:#122420;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:10px;font-size:.9em;font-weight:700;cursor:pointer}.top button.active{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:10px 18px;border-radius:999px;cursor:pointer}.chip.active{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:10px;cursor:pointer}.card.best{border:2px solid var(--ok);background:#1b2f2b}.head{display:flex;justify-content:space-between;align-items:center}.price{font-size:1.8em;font-weight:900}.badge{background:var(--ok);color:#0a2e16;padding:3px 10px;border-radius:20px;font-size:.7em;font-weight:800}
.mute{color:var(--mute);font-size:.85em}.detail{display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.detail.open{display:block}.line{display:flex;justify-content:space-between;margin:6px 0;font-size:.9em}
.btn{width:100%;padding:14px;border-radius:12px;border:none;background:var(--acc);color:#1e1235;font-weight:800;cursor:pointer;margin-top:10px}.btn2{background:transparent;border:1px solid var(--line);color:var(--ink)}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>Rota Viva</h1>
<p class="sub">Escolha as cidades • Toque no card pra ver impostos</p>

<div class="tabs">
<button class="tab active" id="tabCalc" onclick="showTab('calc')">Calculadora</button>
<button class="tab" id="tabPlan" onclick="showTab('plan')">Anotações</button>
</div>

<div id="viewCalc">
<!-- ORIGEM COM BUSCA -->
<div class="panel" id="pOrigem">
<div class="label"><span>Origem</span><span id="oUF" class="mute"></span></div>
<input id="origem" placeholder="Digite: Manaus, São Paulo..." autocomplete="off" oninput="buscar('origem')" onfocus="buscar('origem')">
<div class="city-list" id="listOrigem"></div>
<div class="swap" onclick="trocar()">↕</div>
</div>

<!-- DESTINO COM BUSCA -->
<div class="panel" id="pDestino">
<div class="label"><span>Destino</span><span id="dUF" class="mute"></span></div>
<input id="destino" placeholder="Digite: Belém, Itacoatiara..." autocomplete="off" oninput="buscar('destino')" onfocus="buscar('destino')">
<div class="city-list" id="listDestino"></div>
</div>

<div class="panel">
<div class="label">Período / Rio</div>
<select id="per" onchange="calc()"><option value="cheia">Cheia - normal</option><option value="seca" selected>Seca - taxa +25%</option></select>
</div>

<div class="panel">
<div class="label">Peso - pode digitar</div>
<input id="carga" type="number" inputmode="decimal" value="0.5" step="0.01" oninput="calc()">
<div class="top"><button id="b500" class="active" onclick="setW(0.5)">500kg</button><button id="b2" onclick="setW(2)">2 ton</button><button id="b14" onclick="setW(14)">14 ton</button></div>
<div style="margin-top:12px"><div class="label">Valor mercadoria (seguro 1%)</div><input id="vMerc" type="number" value="5000" oninput="calc()"></div>
<div class="chips"><button class="chip active" id="cBar" onclick="setC('barato')">Mais barato</button><button class="chip" id="cRap" onclick="setC('rapido')">Mais rápido</button><button class="chip" id="cEq" onclick="setC('eq')">Equilibrado</button></div>
</div>

<div id="res"></div>
</div>

<div id="viewPlan" class="hidden">
<div class="panel"><div class="label">Anotações</div><textarea id="anotacoes" rows="14" placeholder="Cliente: Maria - 500kg farinha - R$150
Origem: Itacoatiara -> Manaus
WhatsApp: ...
"></textarea><button class="btn" onclick="salvarAnot()">Salvar</button><button class="btn btn2" onclick="exportTxt()">Exportar</button><div class="mute" id="saveMsg" style="text-align:center;margin-top:8px"></div></div>
</div>
</main>
<script>
// CIDADES IMPORTANTES - CAPITAIS + NORTE
const cidades=[
{name:"Manaus",uf:"AM",lat:-3.119,lon:-60.021,t:"norte"},
{name:"Itacoatiara",uf:"AM",lat:-3.143,lon:-58.444,t:"norte"},
{name:"Parintins",uf:"AM",lat:-2.628,lon:-56.735,t:"norte"},
{name:"Manacapuru",uf:"AM",lat:-3.289,lon:-60.62,t:"norte"},
{name:"Belém",uf:"PA",lat:-1.455,lon:-48.504,t:"norte"},
{name:"Santarém",uf:"PA",lat:-2.443,lon:-54.708,t:"norte"},
{name:"Marabá",uf:"PA",lat:-5.368,lon:-49.117,t:"norte"},
{name:"Ananindeua",uf:"PA",lat:-1.365,lon:-48.372,t:"norte"},
{name:"Porto Velho",uf:"RO",lat:-8.761,lon:-63.9,t:"norte"},
{name:"Ji-Paraná",uf:"RO",lat:-10.877,lon:-61.932,t:"norte"},
{name:"Boa Vista",uf:"RR",lat:2.823,lon:-60.675,t:"norte"},
{name:"Rio Branco",uf:"AC",lat:-9.975,lon:-67.824,t:"norte"},
{name:"Macapá",uf:"AP",lat:0.034,lon:-51.069,t:"norte"},
{name:"Palmas",uf:"TO",lat:-10.168,lon:-48.331,t:"norte"},
{name:"São Paulo",uf:"SP",lat:-23.55,lon:-46.633,t:"capital"},
{name:"Rio de Janeiro",uf:"RJ",lat:-22.906,lon:-43.172,t:"capital"},
{name:"Brasília",uf:"DF",lat:-15.793,lon:-47.882,t:"capital"},
{name:"Belo Horizonte",uf:"MG",lat:-19.916,lon:-43.934,t:"capital"},
{name:"Curitiba",uf:"PR",lat:-25.429,lon:-49.267,t:"capital"},
{name:"Porto Alegre",uf:"RS",lat:-30.034,lon:-51.217,t:"capital"},
{name:"Salvador",uf:"BA",lat:-12.977,lon:-38.501,t:"capital"},
{name:"Recife",uf:"PE",lat:-8.047,lon:-34.877,t:"capital"},
{name:"Fortaleza",uf:"CE",lat:-3.717,lon:-38.543,t:"capital"},
{name:"Goiânia",uf:"GO",lat:-16.686,lon:-49.264,t:"capital"},
{name:"São Luís",uf:"MA",lat:-2.538,lon:-44.282,t:"capital"},
{name:"Cuiabá",uf:"MT",lat:-15.601,lon:-56.097,t:"capital"},
{name:"Campo Grande",uf:"MS",lat:-20.469,lon:-54.62,t:"capital"},
{name:"Florianópolis",uf:"SC",lat:-27.594,lon:-48.548,t:"capital"},
{name:"Vitória",uf:"ES",lat:-20.315,lon:-40.312,t:"capital"},
{name:"Natal",uf:"RN",lat:-5.794,lon:-35.211,t:"capital"},
{name:"João Pessoa",uf:"PB",lat:-7.119,lon:-34.845,t:"capital"},
{name:"Maceió",uf:"AL",lat:-9.665,lon:-35.735,t:"capital"},
{name:"Aracaju",uf:"SE",lat:-10.947,lon:-37.073,t:"capital"},
{name:"Teresina",uf:"PI",lat:-5.089,lon:-42.801,t:"capital"},
{name:"São Luís",uf:"MA",lat:-2.538,lon:-44.282,t:"capital"}
];
let origemSel=cidades[0], destinoSel=cidades[4];

function buscar(tipo){
 const input=document.getElementById(tipo); const list=document.getElementById(tipo=='origem'?'listOrigem':'listDestino');
 const q=input.value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
 const filtr=cidades.filter(c=> c.name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").includes(q) || c.uf.toLowerCase().includes(q)).slice(0,8);
 list.innerHTML=filtr.map(c=>`<div class="city-item" onclick="selecionar('${tipo}','${c.name}')"><span><b>${c.name}</b> - ${c.uf}</span><small>${c.t=='norte'?'Norte':''} ${c.t=='capital'?'Capital':''}</small></div>`).join('');
 list.className='city-list open';
}
function selecionar(tipo,nome){
 const c=cidades.find(x=>x.name==nome);
 if(tipo=='origem'){ origemSel=c; origem.value=c.name+' - '+c.uf; oUF.innerText=c.uf; document.getElementById('listOrigem').className='city-list'; }
 else { destinoSel=c; destino.value=c.name+' - '+c.uf; dUF.innerText=c.uf; document.getElementById('listDestino').className='city-list'; }
 calc();
}
function trocar(){ const tmp=origemSel; origemSel=destinoSel; destinoSel=tmp; origem.value=origemSel.name+' - '+origemSel.uf; destino.value=destinoSel.name+' - '+destinoSel.uf; calc(); }
document.addEventListener('click',e=>{ if(!e.target.closest('#pOrigem')) document.getElementById('listOrigem').className='city-list'; if(!e.target.closest('#pDestino')) document.getElementById('listDestino').className='city-list'; });

function distKm(a,b){
 const R=6371; const dLat=(b.lat-a.lat)*Math.PI/180; const dLon=(b.lon-a.lon)*Math.PI/180;
 const x=Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2;
 return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

let crit='barato';
function showTab(t){viewCalc.className=t=='calc'?'':'hidden';viewPlan.className=t=='plan'?'':'hidden';tabCalc.className=t=='calc'?'tab active':'tab';tabPlan.className=t=='plan'?'tab active':'tab';}
function setW(v){carga.value=v;document.querySelectorAll('.top button').forEach(b=>b.className='');document.getElementById(v==0.5?'b500':v==2?'b2':'b14').className='active';calc();}
function setC(c){crit=c;document.querySelectorAll('.chip').forEach(b=>b.className='chip');document.getElementById(c=='barato'?'cBar':c=='rapido'?'cRap':'cEq').className='chip active';calc();}

function calc(){
 if(!origemSel||!destinoSel) return;
 const ton=parseFloat(carga.value)||0.5; const vMerc=parseFloat(vMercInput())||0;
 const km=distKm(origemSel,destinoSel); const mult=per.value=='seca'?1.25:1;
 const ehNorte=origemSel.t=='norte' && destinoSel.t=='norte';
 const temBalsa=(origemSel.uf=='RO'&&destinoSel.uf=='AM')||(origemSel.uf=='AM'&&destinoSel.uf=='RO')||km>800;
 function build(def,d,nome){
  if(!def) return null;
  const freteBase=def*ton*mult*(km/270); // ajusta por distancia
  const balsa=temBalsa && nome!='Aéreo' ? 4800 : 0;
  const sub=freteBase+balsa;
  const icms=sub*0.12; const porto=ton*1000>=50?30:0; const seguro=vMerc*0.01; const afrmm=nome.includes('Hidro')?sub*0.08:0;
  const total=sub+icms+porto+seguro+afrmm;
  return {nome,def,d,freteBase,balsa,icms,porto,seguro,afrmm,total,km};
 }
 const rodDef=ehNorte?428:220; const hidDef=ehNorte? (km<400?150:350) : 9999; const aerDef=ehNorte?1800:1200;
 const list=[
  build(rodDef, km/600+1, 'Rodoviário'),
  hidDef<9000?build(hidDef, km/300+2, 'Hidroviário'):null,
  build(aerDef, 0.5, 'Aéreo')
 ].filter(Boolean);
 const best=crit=='barato'?list.reduce((a,b)=>a.total<b.total?a:b):crit=='rapido'?list.reduce((a,b)=>a.d<b.d?a:b):list.reduce((a,b)=>(a.total/500+a.d*50)<(b.total/500+b.d*50)?a:b);
 function card(o,i){
  const isBest=o.nome==best.nome;
  return `<div class="card ${isBest?'best':''}" onclick="this.querySelector('.detail').classList.toggle('open')">
   <div class="head"><div><b>${o.nome}</b><div class="mute">${Math.round(o.km)}km • ${o.d.toFixed(1)} dias</div></div>
   <div style="text-align:right">${isBest?'<span class="badge">MELHOR</span>':''}<div class="price">R$ ${o.total.toFixed(2).replace('.',',')}</div><div class="mute">R$ ${(o.total/(ton*1000)).toFixed(2)}/kg</div></div></div>
   <div class="detail" id="det${i}">
     <div class="line"><span>Frete base (${o.def}/ton ajustado ${Math.round(o.km)}km)</span><b>R$ ${o.freteBase.toFixed(2)}</b></div>
     ${o.balsa?`<div class="line"><span>Balsa Rô-Rô (R$4.500-5.000)</span><b>R$ ${o.balsa.toFixed(2)}</b></div>`:''}
     <div class="line"><span>ICMS 12% AM</span><b>R$ ${o.icms.toFixed(2)}</b></div>
     <div class="line"><span>Taxa Porto</span><b>R$ ${o.porto.toFixed(2)}</b></div>
     <div class="line"><span>Seguro 1%</span><b>R$ ${o.seguro.toFixed(2)}</b></div>
     ${o.afrmm?`<div class="line"><span>AFRMM 8% hidro</span><b>R$ ${o.afrmm.toFixed(2)}</b></div>`:''}
     <div class="line" style="border-top:1px solid var(--line);padding-top:6px"><b>Total com impostos</b><b>R$ ${o.total.toFixed(2)}</b></div>
   </div>
  </div>`;
 }
 res.innerHTML=`<div class="mute" style="text-align:center;margin-bottom:8px">${origemSel.name} → ${destinoSel.name} • ${Math.round(km)}km</div>`+list.map((o,i)=>card(o,i)).join('');
}
function vMercInput(){return document.getElementById('vMerc').value;}
// init
origem.value=origemSel.name+' - '+origemSel.uf; destino.value=destinoSel.name+' - '+destinoSel.uf; oUF.innerText=origemSel.uf; dUF.inner
