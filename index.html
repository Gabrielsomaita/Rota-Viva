<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<title>Rota Viva</title>
<style>
:root{--bg:#0f1f1d;--card:#1a2e2b;--line:#233f3a;--ink:#e6f0ee;--mute:#9bbcb6;--acc:#c4a4ff;--acc2:#a78bfa;--ok:#4ade80}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;padding:0 14px 20px}
main{max-width:640px;margin:0 auto}h1{font-size:2.2em;margin:20px 0 4px}.lead{color:var(--mute);margin:0 0 16px}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font-weight:700;cursor:pointer}.tab.active{background:var(--acc);color:#1e1235}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.label{color:var(--mute);font-size:.9em;margin-bottom:8px}select,input{width:100%;background:#122420;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:13px 14px;font-size:1em}
.row{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:9px 16px;border-radius:999px;cursor:pointer}.chip.active{background:var(--acc);color:#1e1235;font-weight:700}
.card{border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px;background:#162a27}.card.best{border:2px solid var(--acc2);background:#231e36}
.total{font-size:1.8em;font-weight:900;margin:4px 0}.mute{color:var(--mute);font-size:.88em}
.badge{background:var(--ok);color:#0a2e16;padding:2px 10px;border-radius:20px;font-size:.7em;font-weight:800;margin-left:8px}
.btn{width:100%;padding:14px;border-radius:12px;border:none;background:var(--acc);color:#1e1235;font-weight:800;cursor:pointer;margin-top:10px}.btn2{background:transparent;border:1px solid var(--line);color:var(--ink)}
