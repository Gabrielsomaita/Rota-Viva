<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vantis</title>
<link rel="icon" type="image/png" href="vantis-icon.png">
<link rel="apple-touch-icon" href="vantis-icon.png">
<meta name="theme-color" content="#000000">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:#000;color:#fff}
.wrap{max-width:520px;margin:auto;padding:12px 12px 100px}
h1{text-align:center;padding:18px 0;font-size:24px;letter-spacing:1px}
.logo-header{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px 0}
.logo-header img{width:44px;height:44px;border-radius:12px;object-fit:cover}
.logo-header span{font-size:24px;font-weight:800;letter-spacing:1px}
h3{margin:12px 0}
.card{background:#111;border:1px solid #222;border-radius:16px;padding:14px;margin:12px 0}
.card.best{border:2px solid #8B5CF6}
.card.off{opacity:.55}
.sel{display:block;background:#111;border:1px solid #333;border-radius:12px;padding:12px;width:100%;color:#fff;margin:6px 0;outline:none;font-size:15px}
.sel:focus,.tax-grid input:focus{border-color:#8B5CF6}
.s{font-size:11px;color:#888}.t{font-weight:800;font-size:15px}
.badge{background:#8B5CF6;color:#fff;font-size:10px;padding:3px 8px;border-radius:8px;margin-left:6px}
.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.label{font-size:12px;color:#22C55E;font-weight:800;margin:12px 0 4px 4px;display:block}
.pontuacao{background:#0f0f0f;border:1px solid #222;border-radius:12px;padding:10px;display:flex;justify-content:space-between;margin-top:8px}
.pontuacao div{text-align:center;flex:1}
.pontuacao .val{font-weight:800;font-size:14px}
.pontuacao .lbl{font-size:10px;color:#888}
.route-origin{font-size:12px;color:#A78BFA;font-weight:700;margin-bottom:6px}
.btn{padding:10px 14px;border-radius:12px;border:1px solid #2a2a2a;background:#151515;color:#aaa;font-weight:600;cursor:pointer}
.btn.on{border-color:#8B5CF6;color:#fff}
.btn-purple{display:block;background:#8B5CF6;color:#fff;border:none;font-weight:800;width:100%;margin-top:8px;padding:12px;border-radius:12px;cursor:pointer;font-size:15px}
.tax-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tax-grid input{background:#0f0f0f;border:1px solid #333;border-radius:10px;padding:10px;color:#fff;width:100%;outline:none}
.pago,.naopago{padding:6px 12px;border-radius:20px;font-size:13px;font-weight:700}
.pago{color:#22C55E;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3)}
.naopago{color:#EF4444;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3)}
.aviso{color:#F59E0B;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);border-radius:12px;padding:12px;font-size:13px;margin:12px 0}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#000;display:flex;border-top:1px solid #1a1a1a}
.tabs button{flex:1;padding:14px;background:none;border:none;color:#666;font-weight:700;cursor:pointer}
.tabs button.active{color:#fff;box-shadow:inset 0 2px #8B5CF6}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;padding:16px;z-index:99}
.modal.show{display:flex}
.modal-box{background:#111;border:1px solid #333;border-radius:16px;padding:16px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
.swap{display:flex;gap:8px;align-items:flex-end}
.swap>div{flex:1}
.swap .btn{padding:12px 14px;margin-bottom:6px}
.chk{display:flex;gap:8px;align-items:center;margin:10px 4px;font-size:13px;color:#ccc}
.chk input{width:auto}
#toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:#222;border:1px solid #8B5CF6;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;display:none;z-index:120}
</style>
</head>
<body>
<div class="wrap">
<div class="logo-header"><img src="vantis-icon.png" alt="Vantis"><span>Vantis</span></div>

<section id="vRotas">
  <div class="card">
    <div class="row">
      <div style="flex:1"><div class="s">Peso da carga (kg)</div><input id="peso" type="number" min="0" inputmode="decimal" value="1000" class="sel"></div>
      <div style="flex:1"><div class="s">Valor da carga (R$)</div><input id="valorCarga" type="number" min="0" inputmode="decimal" value="15000" class="sel"></div>
    </div>
    <div id="pontuacaoGeral" class="pontuacao"></div>
  </div>

  <div class="swap">
    <div><label class="label" for="origem">Origem</label><select id="origem" class="sel"></select></div>
    <button id="trocar" class="btn" title="Trocar origem e destino" aria-label="Trocar origem e destino">⇄</button>
    <div><label class="label" for="destino">Destino</label><select id="destino" class="sel"></select></div>
  </div>

  <label class="label" for="epoca">Época do ano (nível do rio)</label>
  <select id="epoca" class="sel"></select>
  <div id="epocaInfo" class="s" style="margin-left:4px"></div>

  <label class="label" for="cargaTipo">Tipo de carga (tabela ANTT)</label>
  <select id="cargaTipo" class="sel"></select>

  <div class="row">
    <div style="flex:1;min-width:150px"><label class="label" for="veiculo">Veículo (estrada)</label><select id="veiculo" class="sel"></select></div>
    <div style="flex:1;min-width:150px"><label class="label" for="contrat">Contratação</label>
      <select id="contrat" class="sel">
        <option value="auto">Automática (menor valor)</option>
        <option value="lot">Lotação (caminhão inteiro)</option>
        <option value="frac">Fracionado (parte do caminhão)</option>
      </select></div>
  </div>
  <label class="chk" for="retorno"><input type="checkbox" id="retorno"> Incluir retorno vazio (ANTT: + 0,92 × CCD × km)</label>

  <label class="label" for="distMan">Distância (km) — automática ao trocar as cidades</label>
  <input id="distMan" type="number" min="0" inputmode="decimal" class="sel" placeholder="Automático">
  <div id="distInfo" class="s" style="margin-left:4px"></div>

  <div id="cards"></div>
</section>

<section id="vAlt" style="display:none">
  <h3>Alternativas</h3>
  <input id="altNome" class="sel" placeholder="Ex: Balsa Manaus-Itacoatiara">
  <input id="altValor" type="number" min="0" inputmode="decimal" class="sel" placeholder="Valor R$">
  <div style="display:flex;gap:8px;margin:10px 0">
    <button id="chipPago" class="btn" style="border-color:#22C55E;color:#22C55E">● Pago</button>
    <button id="chipNao" class="btn" style="border-color:#2a2a2a;color:#EF4444">● Não pago</button>
  </div>
  <textarea id="altObs" class="sel" rows="2" placeholder="Observação"></textarea>
  <button id="salvarAlt" class="btn-purple">Salvar alternativa</button>
  <div style="display:flex;gap:8px;margin:14px 0 8px">
    <button class="btn on" id="filtroAtivas">Ativas</button>
    <button class="btn" id="filtroLixeira">🗑 Lixeira</button>
  </div>
  <div id="listaAlt"></div>
</section>

<section id="vImp" style="display:none">
  <h3>Impostos por modal (toque para editar)</h3>
  <div id="listaImpostos"></div>
  <button id="resetImp" class="btn" style="width:100%">Restaurar valores padrão</button>
</section>
</div>

<nav class="tabs">
  <button id="tabRotas" class="active">Rotas</button>
  <button id="tabAnot">Alternativas</button>
  <button id="tabImpostos">Impostos</button>
</nav>
<div id="toast"></div>
<div id="modalDetalhe" class="modal"><div class="modal-box" id="detalheBox"></div></div>
<div id="modalEdit" class="modal"><div class="modal-box" id="editBox"></div></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fnum=n=>Number(n).toLocaleString('pt-BR',{maximumFractionDigits:3});
const n4=n=>Number(n).toLocaleString('pt-BR',{minimumFractionDigits:4,maximumFractionDigits:4});
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)&&n>0?n:0};
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let tt;function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2500)}
function confirmar(msg,fn,rotulo='Sim, excluir'){
  $('editBox').innerHTML=`<h3>${esc(msg)}</h3><button class="btn-purple" id="cOk" style="background:#EF4444">${esc(rotulo)}</button><button class="sel btn" id="cNo" style="margin-top:8px">Cancelar</button>`;
  $('modalEdit').classList.add('show');
  $('cNo').onclick=()=>$('modalEdit').classList.remove('show');
  $('cOk').onclick=()=>{$('modalEdit').classList.remove('show');fn()};
}
const CID={
"Manaus":[-3.119,-60.022],"Belém":[-1.456,-48.502],"Porto Velho":[-8.761,-63.900],"Rio Branco":[-9.975,-67.824],
"Boa Vista":[2.823,-60.675],"Palmas":[-10.184,-48.333],"Macapá":[0.034,-51.066],"Itacoatiara":[-3.143,-58.444],
"Urucurituba":[-3.130,-58.150],"Parintins":[-2.628,-56.736],"Santarém":[-2.443,-54.708],"Itapiranga":[-2.746,-58.030],
"São Sebastião do Uatumã":[-2.572,-57.873],"Ananindeua":[-1.366,-48.372],"Marabá":[-5.368,-49.118],
"Parauapebas":[-6.067,-49.903],"Ji-Paraná":[-10.885,-61.951],"Ariquemes":[-9.913,-63.041],"Vilhena":[-12.741,-60.146],
"Urucará":[-2.536,-57.756],"Silves":[-2.840,-58.209]
};
const UF={
"Manaus":"AM","Belém":"PA","Porto Velho":"RO","Rio Branco":"AC","Boa Vista":"RR","Palmas":"TO","Macapá":"AP","Itacoatiara":"AM",
"Urucurituba":"AM","Parintins":"AM","Santarém":"PA","Itapiranga":"AM","São Sebastião do Uatumã":"AM","Ananindeua":"PA","Marabá":"PA",
"Parauapebas":"PA","Ji-Paraná":"RO","Ariquemes":"RO","Vilhena":"RO","Urucará":"AM","Silves":"AM"
};
const ICMS_INT={AC:19,AP:18,AM:20,PA:19,RO:19.5,RR:20,TO:20};
function icmsAuto(nome,o,d){
  if(UF[o]!==UF[d]) return nome==='Aéreo'?4:12;
  return ICMS_INT[UF[o]];
}
const AERO=new Set(["Manaus","Belém","Porto Velho","Rio Branco","Boa Vista","Palmas","Macapá","Santarém","Marabá","Parauapebas","Parintins","Ji-Paraná","Vilhena"]);
function haversine(a,b){
  const R=6371,rad=x=>x*Math.PI/180,dLa=rad(b[0]-a[0]),dLo=rad(b[1]-a[1]);
  const h=Math.sin(dLa/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const RC=store.get('roadcache',{}),PEND={};
function roadAuto(o,d){
  const k=o+'>'+d;
  if(k in RC) return RC[k];
  if(!PEND[k]){
    PEND[k]=1;
    const [a,b]=[CID[o],CID[d]];
    fetch(`https://router.project-osrm.org/route/v1/driving/${a[1]},${a[0]};${b[1]},${b[0]}?overview=false`)
      .then(r=>r.json())
      .then(j=>{
        const m=j&&j.routes&&j.routes[0];
        if(m){RC[k]=Math.round(m.distance/1000);store.set('roadcache',RC)}
        else RC[k]=0;
      })
      .catch(()=>{RC[k]=0})
      .finally(()=>{delete PEND[k];render()});
  }
  return undefined;
}
const J='Entroncamento AM-363';
const HID=new Set([J]);
const E=[
['Manaus',J,'road',229,'ap'],[J,'Itacoatiara','road',40,'ap'],
[J,'Itapiranga','road',111],[J,'Silves','road',108],
['Manaus','Porto Velho','road',877,'br319'],
['Manaus','Boa Vista','road',785],
['Porto Velho','Rio Branco','road',515],
['Porto Velho','Ariquemes','road',200,'ap'],['Ariquemes','Ji-Paraná','road',177,'ap'],
['Ji-Paraná','Vilhena','road',328,'ap'],
['Belém','Ananindeua','road',17,'ap'],['Belém','Marabá','road',554],['Marabá','Parauapebas','road',169],
['Marabá','Palmas','road',652],
['Manaus','Itacoatiara','river',194],
['Itacoatiara','Urucurituba','river',37,'ap'],['Urucurituba','Parintins','river',189,'ap'],
['Parintins','Santarém','river',319,'ap'],['Santarém','Belém','river',907,'ap'],
['Belém','Macapá','river',600],['Santarém','Macapá','river',770],
['Itacoatiara','Porto Velho','river',1115],
['Manaus','Urucará','river',281],['Manaus','São Sebastião do Uatumã','river',255],
['Itacoatiara','Urucará','river',110,'ap'],['Itacoatiara','São Sebastião do Uatumã','river',100,'ap']
];
const ADJ={};
E.forEach(([a,b,m,km,f])=>{(ADJ[a]=ADJ[a]||[]).push({to:b,from:a,m,km,f});(ADJ[b]=ADJ[b]||[]).push({to:a,from:b,m,km,f})});
function trajeto(o,d,modes,mixed){
  const start=o+'|0',dist={[start]:0},prev={},done={};
  for(;;){
    let u=null,best=Infinity;
    for(const k in dist) if(!done[k]&&dist[k]<best){best=dist[k];u=k}
    if(u===null) return null;
    done[u]=1;
    const [n,m]=u.split('|');
    if(n===d&&(!mixed||m==='3')){
      const legs=[];let k=u;
      while(prev[k]){legs.unshift(prev[k].e);k=prev[k].from}
      if(mixed){const ns=[legs[0].from,...legs.map(l=>l.to)];if(new Set(ns).size!==ns.length) return null}
      return legs;
    }
    for(const e of ADJ[n]||[]){
      if(!modes.includes(e.m)) continue;
      const k=e.to+'|'+((+m)|(e.m==='road'?1:2)),nd=best+e.km;
      if(nd<(dist[k]??Infinity)){dist[k]=nd;prev[k]={from:u,e}}
    }
  }
}
function fundir(legs){
  const out=[];let cur=null;
  legs.forEach(l=>{
    if(!cur) cur={from:l.from,m:l.m,km:0,ap:false,f:''};
    cur.km+=l.km;if(l.f==='ap')cur.ap=true;if(l.f==='br319')cur.f='br319';
    if(!HID.has(l.to)){cur.to=l.to;out.push(cur);cur=null}
  });
  return out;
}
const ANTT_DEF={
 'Carga geral':{2:[4.0738,451.84],3:[5.2177,541.86],4:[5.9180,588.86],5:[6.8284,657.56],6:[7.5347,671.93],7:[8.2727,831.66],9:[9.4114,903.32]},
 'Granel sólido':{2:[4.1056,460.59],3:[5.2555,552.24],4:[5.9476,597.00],5:[6.8548,664.83],6:[7.5641,680.01],7:[8.2316,820.34],9:[9.4318,908.91]},
 'Granel líquido':{2:[4.1796,471.98],3:[5.3511,569.57],4:[6.1019,621.52],5:[7.0226,693.08],6:[7.7372,709.72],7:[8.3700,840.50],9:[9.5909,934.76]}
};
const VEIC=[
 {eix:2,nome:'Toco',cap:6000},{eix:3,nome:'Truck',cap:14000},{eix:4,nome:'Bitruck',cap:18000},
 {eix:5,nome:'Carreta 5 eixos',cap:27000},{eix:6,nome:'Carreta 6 eixos',cap:30000},
 {eix:7,nome:'Bitrem',cap:37000},{eix:9,nome:'Rodotrem',cap:50000}
];
function getAntt(){
  const s=store.get('antt_v1',{}),o={};
  for(const c in ANTT_DEF){o[c]={};for(const e in ANTT_DEF[c]){const v=s[c]&&s[c][e];o[c][e]=Array.isArray(v)&&v[0]>0?v:ANTT_DEF[c][e]}}
  return o;
}
const DEFAULT_IMP={
"Rodoviário":{icms:0,pis:1.65,cofins:7.6,seguro:0.3,taxaFixa:0,taxaSeca:0,custoTonKm:0,fracionado:2,obs:"Frete = piso ANTT (Tabela A): CCD × km + CC, conforme tipo de carga e veículo. Fracionado não tem piso oficial: o fator é uma estimativa de mercado (carga parcial cobra mais por kg). Seguro/GRIS 0,3% da carga. PIS 1,65% e COFINS 7,6% valem para Lucro Real; no Presumido use 0,65% e 3%."},
"Hidroviário (balsa/navio)":{icms:0,pis:1.65,cofins:7.6,seguro:0.5,taxaFixa:140,taxaSeca:65,custoTonKm:0.25,fracionado:1,obs:"Tarifa estimada (não oficial; não existe piso ANTT para rio). Taxa seca só entra na época de Seca."},
"Aéreo":{icms:0,pis:1.65,cofins:7.6,seguro:0.4,taxaFixa:220,taxaSeca:0,custoTonKm:2.5,fracionado:1,obs:"Tarifa estimada (não oficial); só entre cidades com aeroporto de carga. ICMS interestadual 4% (Res. Senado 95/1996)."},
"Multimodal (rio+estrada)":{icms:0,pis:1.65,cofins:7.6,seguro:0.5,taxaFixa:110,taxaSeca:0,custoTonKm:0.35,fracionado:2,obs:"Trecho de estrada pelo piso ANTT + trecho de rio pela tarifa por t.km (estimada). +1 dia por transbordo."}
};
function getImpostos(){
  const saved=store.get('impostos_v2',{}),out={};
  for(const n in DEFAULT_IMP) out[n]={...DEFAULT_IMP[n],...(saved[n]||{})};
  return out;
}
const setImpostos=v=>store.set('impostos_v2',v);
const NOMES=Object.keys(DEFAULT_IMP);
const SPD={road:450,river:200};
const EPOCAS={
 'Seca':{m:'out–nov',river:[1.25,1.4],road:[1,1],txt:'Rio baixo: balsas carregam menos e navegam mais devagar.'},
 'Vazante':{m:'ago–set',river:[1.1,1.15],road:[1,1],txt:'Rio descendo: navegação um pouco mais lenta.'},
 'Enchente':{m:'dez–mar',river:[1,1],road:[1.1,1.2],txt:'Rio subindo, chuva forte: estradas mais lentas.'},
 'Cheia':{m:'abr–jul',river:[0.95,0.95],road:[1.1,1.25],txt:'Rio cheio: melhor época para balsa; estradas com chuva.'}
};
const autoEpoca=()=>{const m=new Date().getMonth();return m===9||m===10?'Seca':m===7||m===8?'Vazante':(m===11||m<=2)?'Enchente':'Cheia'};
const IC={road:'🚚',river:'🚢',air:'✈️'},TX={road:'estrada',river:'rio',air:'avião'};
const selO=$('origem'),selD=$('destino'),selE=$('epoca');
let distEdit=false;
const opts=Object.keys(CID).map(c=>`<option>${esc(c)}</option>`).join('');
selO.innerHTML=opts;selD.innerHTML=opts;selO.value="Itacoatiara";selD.value="Manaus";
selE.innerHTML=Object.keys(EPOCAS).map(e=>`<option value="${e}">${e} (${EPOCAS[e].m})</option>`).join('');
selE.value=autoEpoca();
$('cargaTipo').innerHTML=Object.keys(ANTT_DEF).map(c=>`<option>${esc(c)}</option>`).join('');
$('veiculo').innerHTML='<option value="0">Automático (menor que comporta)</option>'+VEIC.map(v=>`<option value="${v.eix}">${esc(v.nome)} (${v.eix} eixos, ~${fnum(v.cap/1000)} t)</option>`).join('');
function misto(o,d){
  const m=trajeto(o,d,['road','river'],true);
  if(!m) return null;
  const len=m.reduce((t,e)=>t+e.km,0);
  const sing=[trajeto(o,d,['road'],false),trajeto(o,d,['river'],false)].filter(Boolean).map(l=>l.reduce((t,e)=>t+e.km,0));
  if(sing.length&&len>1.3*Math.min(...sing)) return null;
  return m;
}
function legsDoModal(nome,o,d,manual){
  if(nome==='Aéreo'&&!(AERO.has(o)&&AERO.has(d))) return null;
  if(manual) return [{from:o,to:d,m:nome==='Aéreo'?'air':nome.startsWith('Hidro')?'river':'road',km:manual,f:''}];
  if(nome==='Rodoviário'){
    let l=trajeto(o,d,['road'],false);
    if(!l){const km=roadAuto(o,d);if(km>0) l=[{from:o,to:d,m:'road',km,f:''}]}
    return l;
  }
  if(nome.startsWith('Hidro')) return trajeto(o,d,['river'],false);
  if(nome.startsWith('Multi')) return misto(o,d);
  return [{from:o,to:d,m:'air',km:Math.round(haversine(CID[o],CID[d])),f:''}];
}
function precoRodo(kmR,peso,sel,antt,fator){
  const v=sel.veic?VEIC.find(x=>x.eix===sel.veic):(VEIC.find(x=>x.cap>=peso)||VEIC[VEIC.length-1]);
  const [ccd,cc]=antt[sel.carga][v.eix];
  const ida=r2(ccd*kmR+cc),cheio=r2(ccd*kmR+cc+(sel.ret?0.92*ccd*kmR:0)),retv=r2(cheio-ida);
  const viagens=Math.max(1,Math.ceil(peso/v.cap-1e-9)),lot=r2(cheio*viagens);
  let modo='Lotação',val=lot;
  if(viagens===1&&sel.contrat!=='lot'){

function precificar(nome,legs,peso,valor,imp,ep,sel,antt,icmsPct){
  const ton=peso/1000,E_=EPOCAS[ep];
  let dias=0,km=0,kmRoad=0,eqRio=0,kmAir=0,br319=false;
  legs.forEach((l,i)=>{
    let tf=l.m==='air'?1:E_[l.m][1];
    if(l.f==='br319'){br319=true;if(ep==='Enchente'||ep==='Cheia') tf*=2}
    km+=l.km;
    if(l.m==='road') kmRoad+=l.km; else if(l.m==='river') eqRio+=l.km*E_.river[0]; else kmAir+=l.km;
    dias+=l.m==='air'?1:l.km/SPD[l.m]*tf;
    if(i&&legs[i-1].m!==l.m) dias+=1;
  });
  const rod=kmRoad>0?precoRodo(kmRoad,peso,sel,antt,imp.fracionado||1):null;
  const aqua=r2(ton*(eqRio+kmAir)*imp.custoTonKm);
  const frete=r2((rod?rod.val:0)+aqua),taxaFixa=r2(imp.taxaFixa);
  const seca=(imp.taxaSeca&&ep==='Seca'&&legs.some(l=>l.m==='river'))?r2(imp.taxaSeca):0;
  const base=r2(frete+taxaFixa+seca),seguro=r2(valor*imp.seguro/100);
  const aIcms=Math.min(icmsPct,99)/100,aPis=imp.pis/100,aCof=imp.cofins/100;
  const bruto=(base+seguro)/Math.max(0.01,1-aIcms-aPis-aCof);
  const icms=r2(bruto*aIcms),pis=r2(bruto*aPis),cofins=r2(bruto*aCof);
  const total=r2(base+seguro+icms+pis+cofins);
  return {nome,imp,legs:fundir(legs),km,eqRio,kmAir,ton,peso,valor,rod,aqua,frete,taxaFixa,seca,base,icmsPct,icms,pis,cofins,seguro,total,br319,
    precoKg:peso>0?r2(total/peso):0,precoTon:ton>0?r2(total/ton):0,prazo:Math.max(1,Math.ceil(dias-1e-9))};
}

function calcular(o,d,peso,valor,manual,ep,imps,sel,antt){

    if(legs){const pct=imps[n].icms>0?imps[n].icms:icmsAuto(n,o,d);ok.push(precificar(n,legs,peso,valor,imps[n],ep,sel,antt,pct))}
    else off.push(n);
  });
  if(ok.length){
    const minT=Math.min(...ok.map(r=>r.total)),minP=Math.min(...ok.map(r=>r.prazo));
    ok.forEach(r=>r.nota=Math.round(60*(r.total>0?minT/r.total:1)+40*(minP/r.prazo)));

}
for(const t in TABS) $(t).onclick=()=>abrirAba(t);
['peso','valorCarga'].forEach(id=>$(id).addEventListener('input',render));
$('distMan').addEventListener('input',()=>{distEdit=$('distMan').value.trim()!=='';render()});
[selO,selD].forEach(s=>s.addEventListener('change',()=>{distEdit=false;render()}));
[selE,$('cargaTipo'),$('veiculo'),$('contrat'),$('retorno')].forEach(s=>s.addEventListener('change',render));
$('trocar').onclick=()=>{const o=selO.value;selO.value=selD.value;selD.value=o;distEdit=false;render()};
['modalDetalhe','modalEdit'].forEach(id=>$(id).addEventListener('click',e=>{if(e.target.id===id) e.target.classList.remove('show')}));
render();renderImpostos();
</script>
</body>
</html>
