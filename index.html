<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<title>Rota Viva - Completo</title>
<style>
:root{--bg:#0f1f1d;--card:#1a2e2b;--line:#243e3a;--ink:#e6f0ee;--mute:#8fb3ad;--acc:#c4a4ff;--acc2:#a78bfa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;padding:12px}
main{max-width:760px;margin:0 auto}h1{margin:8px 0 2px;font-size:1.9em}p.lead{color:var(--mute);margin:0 0 16px;font-size:.92em}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
label{font-size:.85rem;color:var(--mute);margin-bottom:6px;display:block;font-weight:600}
select,input{width:100%;background:#0f2320;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.row{display:flex;gap:8px}.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 12px;border-radius:20px;font-size:.85em}.chip.active{background:var(--acc);color:#1a0f2e;font-weight:700}
.card{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}.card.best{border-color:var(--acc2);background:#221a33}
.score{float:right;color:var(--acc);font-weight:700}
.bar{height:6px;background:#0a1a18;border-radius:10px;margin:6px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc2)}
.mute{color:var(--mute);font-size:.82em}.total{font-size:1.2em;font-weight:800;color:var(--acc2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>
<body>
<main>
<h1>Rota Viva</h1>
<p class="lead">Logística real com impostos e taxas - 2026</p>

<section class="panel">
<label>Trajeto</label>
<select id="rt">
<optgroup label="Saindo de Itacoatiara">
<option value="itacoatiara-manaus">Itacoatiara → Manaus (270km)</option>
<option value="itacoatiara-belem">Itacoatiara → Belém (1.200km)</option>
<option value="itacoatiara-porto-velho">Itacoatiara → Porto Velho (1.000km)</option>
<option value="itacoatiara-boa-vista">Itacoatiara → Boa Vista (750km)</option>
<option value="itacoatiara-rio-branco">Itacoatiara → Rio Branco (1.400km)</option>
<option value="itacoatiara-macapa">Itacoatiara → Macapá (1.000km)</option>
<option value="itacoatiara-palmas">Itacoatiara → Palmas (1.900km)</option>
</optgroup>
<optgroup label="Saindo de Manaus">
<option value="manaus-belem">Manaus → Belém</option>
<option value="manaus-porto-velho">Manaus → Porto Velho</option>
<option value="manaus-boa-vista">Manaus → Boa Vista</option>
<option value="manaus-rio-branco">Manaus → Rio Branco</option>
<option value="manaus-macapa">Manaus → Macapá</option>
<option value="manaus-palmas">Manaus → Palmas</option>
</optgroup>
</select>

<div class="grid2" style="margin-top:12px">
<div><label>Peso da carga</label><div class="row"><input id="carga" type="number" value="3000" min="0"><select id="unidade" style="max-width:80px"><option value="kg" selected>KG</option><option value="ton">TON</option></select></div></div>
<div><label>Valor da mercadoria (p/ seguro)</label><input id="vMerc" type="number" value="10000" placeholder="Ex: 10000"></div>
</div>

<div style="margin-top:12px">
<label>Frete editável R$/TON (igual dólar)</label>
<div class="grid2">
<div><span class="mute">Hidro R$/ton</span><input id="vHidro" type="number" value="43"></div>
<div><span class="mute">Rodoviário R$/ton</span><input id="vRod" type="number" value="107"></div>
<div><span class="mute">Aéreo R$/ton</span><input id="vAereo" type="number" value="736"></div>
<div><span class="mute">Seguro %</span><input id="percSeg" type="number" value="1" step="0.1"></div>
</div>
</div>

<div style="margin-top:12px" class="grid2">
<div><label>Período</label><div class="row"><button class="chip active" id="cheia" onclick="setP('cheia')">Cheia</button><button class="chip" id="seca" onclick="setP('seca')">Seca +25%</button></div></div>
<div><label>Impostos</label><div class="mute">ICMS 12% + Porto R$30 + Taxa mín R$30 (até 50kg) já calculados</div></div>
</div>
</section>

<section class="panel" id="res"></section>
</main>
